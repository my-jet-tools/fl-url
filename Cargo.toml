[package]
name = "flurl"
version = "0.7.0"
authors = ["Andrey <amigin@gmail.com>"]
edition = "2021"

[features]
default = []
with-ssh = ["dep:my-ssh"]

# Internal — do not enable directly, and do not rely on its name. It means "the
# TLS code paths are compiled in"; WHICH provider backs them is the separate
# choice below. Every `#[cfg]` guarding TLS code keys off this, so adding a third
# provider later is one line here instead of ~50 edits across src/.
#
# On its own it compiles the TLS code with no provider installed: an `https://`
# request then fails at connect time with my-tls' "No rustls CryptoProvider is
# installed" error rather than panicking.
_tls = ["dep:my-tls"]

# TLS is decided once for the whole application: neither provider feature, or
# exactly one of the two. Neither is a default - the user picks. Both enable
# `https://` and `with_client_certificate()`; they differ only in the rustls
# CryptoProvider.
#
# ring — mature and very widely deployed; costs a bundled C/assembly build (no
# aws-lc-sys either way).
with-ring-tls = ["_tls", "my-tls/with-ring-crypto-providers"]

# Pure Rust — no C toolchain anywhere, via rustls-graviola. Trade-offs: it builds
# ONLY on x86_64 and aarch64 (a hard `compile_error!` elsewhere) and the crypto
# implementation is far younger and less deployed than ring.
#
# Enabling both — which `--all-features` does — is not an error: my-tls resolves
# the conflict in favour of ring.
with-rust-tls = ["_tls", "my-tls/with-rust-crypto-providers"]

# A modifier, not a TLS switch: it only unlocks accept_invalid_certificate().
# Combine it with a provider feature — on its own the TLS code compiles but no
# provider is installed. Dangerous: disables TLS server-cert verification, and
# even then only for callers that opt in per request.
dangerous-tls = ["_tls", "my-tls/dangerous-tls"]

# wasm only: compiles `.compress()`, which gzips a request body with my-http-utils'
# `HttpRequestBody::compress` (its `compression` feature, flate2 underneath). The native
# backend always has it. Whether a body is compressed is decided at run time, so the
# linker can not drop the gzip code: without this switch every wasm client would carry
# flate2 and crc32fast, called or not. Under wasm `.compress()` without it is a compile
# error.
with-wasm-compression = ["my-http-utils/compression"]

# Native only: compiles `.encrypted(&key)`, which sends a request body encrypted with
# `Content-Encoding: aes128gcm` (RFC 8188), the time it was sent inside. The encryption
# is my-http-utils' `HttpRequestBody::encrypt` with its `HttpBodyEncryptionKey`, which
# my-http-server decrypts with, so both ends do it the same way. All of it is pure Rust.
# The feature does not build for wasm: my-http-utils takes the salt of every body from
# getrandom, which has no browser backend unless the application turns one on.
encryption = ["my-http-utils/encryption"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Target-agnostic dependencies, shared by both the native (`non_wasm`) and the
# `wasm` backends. Everything here must compile on wasm32-unknown-unknown.
[dependencies]
# `rnd` gates `rust_extensions::uuid::generate_v4()`, which supplies the
# `multipart/form-data` boundary (see src/body/mod.rs). On wasm that module is
# available without the feature; the feature is what turns it on for native.
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "rnd",
] }
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
async-trait = "*"

# Native backend (`non_wasm`): hyper / tokio / TLS / connection pooling / ssh.
# None of these compile to wasm, so they are excluded from the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyper = { version = "*", features = ["full"] }
# Declared explicitly rather than free-ridden off my-http-client's feature
# unification: `net` for Tcp/UnixStream, `io-util` for the split halves of a
# connection, `time` for the request timeout, `sync` for the lock a response body is
# read through a shared reference with.
tokio = { version = "*", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
] }
hyper-util = { version = "*", features = ["tokio"] }
http-body-util = { version = "*" }
my-http-client = { tag = "0.1.0", git = "https://github.com/my-jet-tools/my-http-client.git" }
# The same my-http-utils as above, with `compression` on: `.compress()` is always there
# natively, and gzips a request body with `HttpRequestBody::compress`. Under wasm the
# feature comes with `with-wasm-compression` instead.
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "compression",
] }
# The data of a hyper body frame: what a request body is made of and what a response
# body is read in. The wasm backend reads the browser's body into a `Vec<u8>` instead.
bytes = "*"
my-tls = { tag = "0.1.5", git = "https://github.com/MyJetTools/my-tls.git", optional = true }
http = "*"
parking_lot = "*"
ahash = "*"
lazy_static = "*"
# Decodes a gzipped response, which `accept_gzip()` asks for (`MultiGzDecoder` in
# src/non_wasm/fl_url_body_reader.rs). A request body is gzipped by my-http-utils. Under
# wasm the browser decodes the response, so there it is not needed.
flate2 = { version = "*", default-features = false, features = ["rust_backend"] }

# wasm backend (`wasm`): the browser fetch API via web-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "WorkerGlobalScope",
    "Location",
    "WorkerLocation",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "AbortController",
    "AbortSignal",
    "DomException",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "console",
] }

# The streamed-body tests stand up a raw tokio TCP server and read the request off
# the wire themselves, which needs more of tokio than the library does.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "*", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
] }

# Gzips a response body for tests/body_reader.rs, and gunzips what the test servers of
# tests/request_compression.rs and tests/request_encryption.rs receive.
[dev-dependencies]
flate2 = { version = "*" }

# The wasm tests run the backend in a real browser (see tests/retry_wasm.rs).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# SSH is unix-only and therefore never part of the wasm build.
[target.'cfg(unix)'.dependencies]
my-ssh = { tag = "0.1.2", git = "https://github.com/MyJetTools/my-ssh.git", optional = true }
